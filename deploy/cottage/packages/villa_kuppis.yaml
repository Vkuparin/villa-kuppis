# Villa Kuppis cottage controller (card H2.2). Copy to /config/packages/ on
# the cottage Home Assistant and include packages in configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# The rooms below point at the stand-in devices of villa_kuppis_simulator.yaml
# until the real ones are commissioned (H2.1). To switch a room to the real
# devices: replace its entity ids with the ones Home Assistant shows for the
# Mill heaters and the ALPSTUGA, delete villa_kuppis_simulator.yaml and
# restart Home Assistant. Villa Kuppis rebinds the room by itself (from the
# room status sensor's `devices` attribute) and keeps its history.
villa_kuppis_cottage:
  # Heater setpoint when there is no valid target from Villa Kuppis (also
  # when Automaatio is off), and the lowest room target accepted.
  safe_setpoint: 5
  # Heater setpoint when the room is warm enough (driven low).
  low_setpoint: 5
  max_target: 25
  # Heater setpoint when the room needs heat: target + boost.
  boost: 3
  hysteresis: 0.3
  min_dwell_minutes: 10
  # ALPSTUGA reports on change; the stand-in at least every 5 minutes.
  sensor_max_age_minutes: 30
  # A change made by hand (heater, Google Home, HA UI) pauses the room.
  manual_hold_minutes: 240
  max_commands_per_hour: 12
  rooms:
    large:
      name: Iso huone
      sensor: sensor.sim_alpstuga_large_temperature
      humidity: sensor.sim_alpstuga_large_humidity
      co2: sensor.sim_alpstuga_large_carbon_dioxide
      pm25: sensor.sim_alpstuga_large_pm25
      heaters:
        - climate.sim_mill_large_1   # 1050 W
        - climate.sim_mill_large_2   # 1050 W
        - climate.sim_mill_large_3   # 500 W
    small:
      name: Pieni huone
      sensor: sensor.sim_alpstuga_small_temperature
      humidity: sensor.sim_alpstuga_small_humidity
      co2: sensor.sim_alpstuga_small_carbon_dioxide
      pm25: sensor.sim_alpstuga_small_pm25
      heaters:
        - climate.sim_mill_small_1   # 1050 W
