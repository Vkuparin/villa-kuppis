set_target:
  fields:
    room:
      required: true
      selector:
        text:
    target:
      required: true
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    revision:
      required: true
      selector:
        number:
          min: 0
          max: 9999999999
          mode: box
    valid_minutes:
      required: false
      default: 45
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
clear_manual:
  fields:
    room:
      required: true
      selector:
        text:
