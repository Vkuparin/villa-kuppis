set_target:
  fields:
    room:
      required: true
      selector:
        text:
    target:
      required: true
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    revision:
      required: true
      selector:
        number:
          min: 0
          max: 9999999999
          mode: box
    valid_minutes:
      required: false
      default: 45
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    schedule:
      required: false
      example: '[{"start": "2026-11-20T10:15:00+00:00", "target": 8}]'
      selector:
        object:
clear_manual:
  fields:
    room:
      required: true
      selector:
        text:
set_heater_enabled:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate
    enabled:
      required: true
      selector:
        boolean:
set_room_sensor:
  fields:
    room:
      required: true
      selector:
        text:
    entity_id:
      required: false
      selector:
        entity:
          domain: sensor
          device_class: temperature
